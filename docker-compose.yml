version: '3.8'
services:
  mcp-code:
    build:
      context: .
      dockerfile: docker/code-server.Dockerfile
    image: azure-devops-mcp-code-server:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./:/home/coder/project:cached
    environment:
      # set a strong password for code-server; override on runtime or via env file
      - PASSWORD=change_me_secure_password
      - PERSONAL_ACCESS_TOKEN=${PERSONAL_ACCESS_TOKEN}
    networks:
      - mcpnet

networks:
  mcpnet:
    driver: bridge
